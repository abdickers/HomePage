<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sage’s Middle-Earth Dashboard</title>
<style>
    body {
        margin: 0;
        font-family: Cinzel, serif;
        background: url("Revindale.jpg") no-repeat center center fixed;
        background-size: cover;
        color: #e6d9b1;
    }

    a { color: #e6d9b1; }

    .topbar {
        width: 100%;
        padding: 20px;
        text-align: center;
        background: rgba(10, 10, 10, 0.55);
        backdrop-filter: blur(3px);
        border-bottom: 1px solid rgba(255, 255, 200, 0.2);
    }
    .topbar input {
        width: 50%;
        padding: 12px 18px;
        border-radius: 25px;
        border: none;
        background: rgba(30, 30, 30, 0.65);
        color: #fff;
        font-size: 18px;
        text-align: center;
    }

    /* Core panel styles */
    .panel {
        background: rgba(15, 15, 15, 0.40);
        border: 1px solid rgba(255, 240, 200, 0.25);
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 15px rgba(0,0,0,0.3);
        overflow-y: auto;
        overflow-x: hidden;
    }
    .panel::-webkit-scrollbar { width: 8px; }
    .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .panel:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); }

    .grid {
        display: grid;
        gap: 20px;
        padding: 20px;
    }

    /* Layout grid */
    .grid-2 {
        grid-template-columns: 1fr 1fr;
    }

    .grid-3 {
        grid-template-columns: 1fr 1fr 1fr;
    }

    /* Council of Elrond: Gandalf Image */
    .panel-council {
        position: relative;
        overflow: hidden;
    }
    .panel-council::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 45%;
        height: 100%;
        background: url("wp5131299-lord-of-the-rings-4k-wallpapers.jpg") center right / cover no-repeat;
        opacity: 0.22;
        pointer-events: none;
        mix-blend-mode: lighten;
        filter: brightness(1.1) contrast(1.05) saturate(0.85);
    }
    .panel-council:hover::after {
        opacity: 0.33;
        filter: brightness(1.25);
    }

    h2 {
        margin-top: 0;
        font-size: 26px;
        letter-spacing: 2px;
        text-shadow: 1px 1px 3px #000;
    }
</style>
</head>
<body>

<div class="topbar">
    <input type="text" placeholder="Seek the wisdom of the Seeing-Stone (Google AI Search)..." />
</div>

<!-- CHATGPT + GEMINI SECTION (Top Priority) -->
<div class="grid grid-2">
    <div class="panel">
        <h2>Palantír: Gemini</h2>
        <iframe src="https://www.google.com" style="width:100%;height:350px;border:0;border-radius:8px;"></iframe>
    </div>

    <div class="panel">
        <h2>Josie the Wise</h2>
        <iframe src="https://chat.openai.com" style="width:100%;height:350px;border:0;border-radius:8px;"></iframe>
    </div>
</div>

<!-- CALENDAR + SOCIAL -->
<div class="grid grid-2">
    <div class="panel">
        <h2>Chronicles of the Shire</h2>
        <iframe src="https://calendar.google.com/calendar/embed?src=abdickers%40gmail.com&ctz=America%2FChicago"
                style="border:0;width:100%;height:500px;border-radius:10px;"></iframe>
    </div>

    <div class="panel">
        <h2>The Fellowship (Social Media)</h2>
        <iframe 
            src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fadam.dickerson3&tabs=timeline&width=450&height=500&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true"
            width="100%" height="500" style="border:none;overflow:hidden;border-radius:10px;" 
            scrolling="no" frameborder="0" allow="encrypted-media">
        </iframe>
    </div>
</div>

<!-- RSS FEEDS -->
<div class="grid grid-2">
    <div class="panel">
        <h2>News from the Realm (Fox RSS)</h2>
        <iframe src="https://moxie.foxnews.com/google-publisher/latest.xml"
                style="width:100%;height:500px;border:0;border-radius:10px;"></iframe>
    </div>

    <div class="panel">
        <h2>Chronicles of Azeroth (WoWHead RSS)</h2>
        <iframe src="https://www.wowhead.com/news/rss"
                style="width:100%;height:500px;border:0;border-radius:10px;"></iframe>
    </div>
</div>

<!-- COUNCIL OF ELROND -->
<div class="grid">
    <div class="panel panel-council">
        <h2>Council of Elrond</h2>
        <p>Local notes kept in your browser’s <b>localStorage</b>.  
        Think of this as your personal Red Book.</p>

        <textarea id="notes" style="width:100%;height:140px;background:rgba(0,0,0,0.45);color:#fff;border-radius:8px;border:1px solid #555;"></textarea>

        <br><br>
        <button onclick="saveNotes()" style="padding:10px 20px;border-radius:6px;border:1px solid #c7b37b;background:#2e2a1d;color:#e6d9b1;">
            Inscribe
        </button>
    </div>
</div>

<script>
function saveNotes() {
    localStorage.setItem("councilNotes", document.getElementById("notes").value);
}
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("notes").value = localStorage.getItem("councilNotes") || "";
});
</script>

</body>
</html>
