<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sage's Middle-earth Command</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- LOTR Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #050609;
      --panel: rgba(11, 14, 20, 0.92);
      --accent: #f2d38b;
      --accent-soft: #c79a3b;
      --text: #e6e1d5;
      --muted: #a89f8a;
      --radius: 14px;
      --gap: 12px;
    }

    * { box-sizing: border-box; }

    /* Full Rivendell Background */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.85)),
        url("Revindale.jpg") center top / cover no-repeat fixed;
      color: var(--text);
      font-family: "Crimson Pro", serif;
    }

    /* Fellowship Banner Header */
    .banner {
      position: relative;
      width: 100%;
      height: 260px;
      background: url("fellowship_banner_cropped_v2.png") center top / cover no-repeat;
      border-bottom: 1px solid rgba(242,211,139,0.35);
      box-shadow: 0 6px 18px rgba(0,0,0,0.8);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.85));
      pointer-events: none;
    }

    /* Palantír Bar */
    .palantir-bar {
      position: relative;
      z-index: 1;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(242,211,139,0.35);
      border-radius: 999px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Cinzel", serif;
      width: 92%;
      max-width: 900px;
      box-shadow: 0 0 18px rgba(0,0,0,0.8);
    }

    .palantir-label {
      font-weight: 600;
      white-space: nowrap;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .palantir-orb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0, #7fd4ff 20%, #1c2030 60%, #000 100%);
      box-shadow: 0 0 8px rgba(127, 212, 255, 0.75);
      animation: orbPulse 4s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .palantir-form {
      display: flex;
      flex: 1;
      gap: 8px;
    }

    .palantir-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(242,211,139,0.25);
      background: rgba(0,0,0,0.55);
      color: var(--text);
      outline: none;
      font-size: 0.9rem;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: #18130a;
      border: none;
      font-family: "Cinzel", serif;
    }

    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(242,211,139,0.4);
    }

    /* Main layout */
    .layout {
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(360px, 2fr);
      gap: var(--gap);
      margin-top: 8px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(242,211,139,0.3);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .panel-title {
      font-family: "Cinzel", serif;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }

    .muted {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .tiny {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .iframe-wrapper {
      height: 260px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(242,211,139,0.3);
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    #fakeChatLog {
      min-height: 120px;
      max-height: 230px;
      overflow-y: auto;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .news-item {
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(242,211,139,0.25);
    }

    .news-title {
      text-decoration: none;
      color: #f6f0df;
    }

    .news-title:hover {
      text-decoration: underline;
      color: var(--accent);
    }

    .news-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <!-- Fellowship Banner -->
  <div class="banner">
    <div class="palantir-bar">
      <div class="palantir-label">
        <span class="palantir-orb"></span>
        Palantír · Gemini
      </div>

      <form class="palantir-form" id="geminiForm">
        <input id="geminiQuery" type="text" class="palantir-input" placeholder="Consult the palantír…" />
        <button class="btn" type="submit">Invoke</button>
        <button class="btn btn-secondary" type="button" id="openGemini">Open Tower</button>
      </form>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="layout">

    <!-- Calendar -->
    <div class="panel">
      <div class="panel-title">Chronicles of the Shire</div>
      <div class="iframe-wrapper">
        <iframe src="https://calendar.google.com/calendar/embed?src=your_calendar_here&ctz=America%2FChicago"></iframe>
      </div>
      <p class="tiny">Copy your Google Calendar embed URL into the iframe above.</p>
    </div>

    <!-- Notes -->
    <div class="panel">
      <div class="panel-title">Council of Elrond</div>
      <p class="muted">Your notes are kept safely inside <code>localStorage</code>.</p>
      <div id="fakeChatLog"></div>
      <input id="fakeChatInput" class="palantir-input" placeholder="Record counsel…" />
      <button class="btn btn-secondary" id="fakeChatSave">Inscribe</button>
    </div>

    <!-- Messages -->
    <div class="panel">
      <div class="panel-title">Ravens & Messages</div>
      <p class="muted">Messages Web cannot be embedded, but can be opened instantly.</p>
      <button class="btn" onclick="window.open('https://messages.google.com/web','_blank')">Summon Messages</button>
    </div>

    <!-- News -->
    <div class="panel">
      <div class="panel-title">News from the Realm</div>
      <div id="foxNewsContainer" class="muted">Scanning the beacons…</div>
    </div>

  </div>

  <script>
    /* Palantír Search */
    const geminiForm = document.getElementById("geminiForm");
    const geminiQuery = document.getElementById("geminiQuery");
    const openGeminiBtn = document.getElementById("openGemini");

    geminiForm.addEventListener("submit", e => {
      e.preventDefault();
      const q = geminiQuery.value.trim();
      const url = q
        ? `https://gemini.google.com/app#q=${encodeURIComponent(q)}`
        : "https://gemini.google.com/app";
      window.open(url, "_blank");
    });

    openGeminiBtn.onclick = () =>
      window.open("https://gemini.google.com/app", "_blank");

    /* Notes System */
    const chatLog = document.getElementById("fakeChatLog");
    const chatInput = document.getElementById("fakeChatInput");
    const chatSave = document.getElementById("fakeChatSave");

    function appendNote(text) {
      const div = document.createElement("div");
      div.textContent = "You: " + text;
      div.style.marginBottom = "4px";
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    (function loadNotes() {
      try {
        const stored = JSON.parse(localStorage.getItem("sage_council_notes") || "[]");
        stored.forEach(appendNote);
      } catch {}
    })();

    chatSave.addEventListener("click", () => {
      const text = chatInput.value.trim();
      if (!text) return;
      appendNote(text);
      let stored = [];
      try {
        stored = JSON.parse(localStorage.getItem("sage_council_notes") || "[]");
      } catch {}
      stored.push(text);
      localStorage.setItem("sage_council_notes", JSON.stringify(stored));
      chatInput.value = "";
    });

    /* Fox News Feed */
    const foxContainer = document.getElementById("foxNewsContainer");
    async function loadFox() {
      try {
        const res = await fetch(
          "https://api.rss2json.com/v1/api.json?rss_url=" +
          encodeURIComponent("https://feeds.foxnews.com/foxnews/latest?format=xml")
        );
        const data = await res.json();
        if (!data.items || !data.items.length) {
          foxContainer.textContent = "No fresh tidings from the realm.";
          return;
        }
        foxContainer.innerHTML = "";
        data.items.slice(0, 8).forEach(item => {
          const wrap = document.createElement("div");
          wrap.className = "news-item";
          wrap.innerHTML = `
            <a class="news-title" href="${item.link}" target="_blank">${item.title}</a>
            <div class="news-meta">${item.pubDate || ""}</div>
          `;
          foxContainer.appendChild(wrap);
        });
      } catch (e) {
        foxContainer.textContent =
          "The beacons remain dark. Network wards may bar the path.";
      }
    }

    loadFox();
  </script>

</body>
</html>
