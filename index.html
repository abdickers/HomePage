<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sage's Middle-earth Command</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- LOTR Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #050609;
      --panel: rgba(11, 14, 20, 0.97);
      --accent: #f2d38b;
      --accent-soft: #c79a3b;
      --text: #e6e1d5;
      --muted: #a89f8a;
      --radius: 14px;
      --gap: 12px;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #020203;
      color: var(--text);
      font-family: "Crimson Pro", serif;
    }

    /* Fellowship Banner Header */
    .banner {
      width: 100%;
      height: 260px;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.95)),
        url("fellowship_banner_cropped_v2.png") center top / cover no-repeat;
      border-bottom: 1px solid rgba(242,211,139,0.35);
      box-shadow: 0 6px 18px rgba(0,0,0,0.8);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
    }

    /* Palantír Bar */
    .palantir-bar {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(242,211,139,0.35);
      border-radius: 999px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Cinzel", serif;
      width: 92%;
      max-width: 900px;
      box-shadow: 0 0 18px rgba(0,0,0,0.8);
    }

    .palantir-label {
      font-weight: 600;
      white-space: nowrap;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .palantir-orb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0, #7fd4ff 20%, #1c2030 60%, #000 100%);
      box-shadow: 0 0 8px rgba(127, 212, 255, 0.75);
      animation: orbPulse 4s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .palantir-form {
      display: flex;
      flex: 1;
      gap: 8px;
    }

    .palantir-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(242,211,139,0.25);
      background: rgba(0,0,0,0.55);
      color: var(--text);
      outline: none;
      font-size: 0.9rem;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: #18130a;
      border: none;
      font-family: "Cinzel", serif;
    }

    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(242,211,139,0.4);
    }

    .layout {
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(350px, 2fr);
      gap: var(--gap);
      margin-top: 8px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(242,211,139,0.3);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .panel-title {
      font-family: "Cinzel", serif;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }

    .iframe-wrapper {
      height: 250px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(242,211,139,0.3);
    }

    iframe { width: 100%; height: 100%; border: none; }

    .news-item {
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(242,211,139,0.25);
    }

    .news-title {
      text-decoration: none;
      color: #f6f0df;
    }
  </style>
</head>

<body>

  <!-- Fellowship Banner -->
  <div class="banner">
    <div class="palantir-bar">
      <div class="palantir-label">
        <span class="palantir-orb"></span>
        Palantír · Gemini
      </div>

      <form class="palantir-form" id="geminiForm">
        <input id="geminiQuery"
               type="text"
               class="palantir-input"
               placeholder="Consult the palantír…" />

        <button class="btn" type="submit">Invoke</button>
        <button class="btn btn-secondary" type="button" id="openGemini">Open Tower</button>
      </form>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="layout">

    <!-- LEFT COLUMN -->
    <div class="panel">
      <div class="panel-title">Chronicles of the Shire</div>

      <div class="iframe-wrapper">
        <!-- Replace this with your real Google Calendar src -->
        <iframe
          src="https://calendar.google.com/calendar/embed?src=your_calendar_here&ctz=America%2FChicago">
        </iframe>
      </div>

      <p class="tiny">
        Google Calendar → Settings → Integrate → “Embed code”
      </p>
    </div>

    <div class="panel">
      <div class="panel-title">Ravens & Messages</div>
      <button class="btn"
              onclick="window.open('https://messages.google.com/web','_blank')">
        Summon Messages
      </button>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="panel">
      <div class="panel-title">Council of Elrond</div>
      <p class="muted">
        Local storage notes area. Your browser keeps these pages like pages
        in the Red Book.
      </p>
      <div id="fakeChatLog"></div>

      <input id="fakeChatInput" class="palantir-input" placeholder="Record counsel…" />
      <button class="btn btn-secondary" id="fakeChatSave">Inscribe</button>
    </div>

    <div class="panel">
      <div class="panel-title">News from the Realm</div>
      <div id="foxNewsContainer">Loading tidings…</div>
    </div>

  </div>

  <script>
    /* Palantír Search */
    document.getElementById("geminiForm").addEventListener("submit", e => {
      e.preventDefault();
      const q = geminiQuery.value.trim();
      const url = q
        ? `https://gemini.google.com/app#q=${encodeURIComponent(q)}`
        : "https://gemini.google.com/app";
      window.open(url, "_blank");
    });

    document.getElementById("openGemini").onclick = () =>
      window.open("https://gemini.google.com/app", "_blank");

    /* Council Notes Storage */
    const chatLog = document.getElementById("fakeChatLog");
    const chatInput = document.getElementById("fakeChatInput");

    function appendNote(t) {
      const d = document.createElement("div");
      d.style.marginBottom = "6px";
      d.textContent = "You: " + t;
      chatLog.appendChild(d);
    }

    (function load() {
      const saved = JSON.parse(localStorage.getItem("sage_council_notes") || "[]");
      saved.forEach(appendNote);
    })();

    document.getElementById("fakeChatSave").onclick = () => {
      const t = chatInput.value.trim();
      if (!t) return;
      appendNote(t);
      const stored = JSON.parse(localStorage.getItem("sage_council_notes") || "[]");
      stored.push(t);
      localStorage.setItem("sage_council_notes", JSON.stringify(stored));
      chatInput.value = "";
    };

    /* Fox News Feed */
    async function loadFox() {
      try {
        const res = await fetch(
          "https://api.rss2json.com/v1/api.json?rss_url=" +
          encodeURIComponent("https://feeds.foxnews.com/foxnews/latest?format=xml")
        );

        const data = await res.json();
        const list = document.getElementById("foxNewsContainer");

        if (!data.items) {
          list.innerHTML = "No tidings found.";
          return;
        }

        list.innerHTML = "";
        data.items.slice(0, 8).forEach(i => {
          const div = document.createElement("div");
          div.className = "news-item";

          div.innerHTML =
            `<a class="news-title" href="${i.link}" target="_blank">${i.title}</a>
             <div class="news-meta">${i.pubDate}</div>`;

          list.appendChild(div);
        });

      } catch {
        foxNewsContainer.textContent = "The beacons remain dark.";
      }
    }

    loadFox();
  </script>
</body>
</html>
