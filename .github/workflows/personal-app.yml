name: Build actual Personal dashboard app
on:
  push:
    branches: [main]
    paths: ['android-personal/**', '.github/workflows/personal-app.yml']
  pull_request:
    paths: ['android-personal/**', '.github/workflows/personal-app.yml']
  workflow_dispatch:
concurrency:
  group: personal-app-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - screen: pixel
            size: 1280x2856
            font: 1.0
          - screen: narrow
            size: 1080x2400
            font: 1.3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK and test APK
        working-directory: android-personal
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Personal website in the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell wm size ${{ matrix.size }}
            adb shell wm density 480
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell "echo chrome --disable-fre --no-default-browser-check > /data/local/tmp/chrome-command-line"
            adb install android-personal/app/build/outputs/apk/debug/app-debug.apk
            adb install android-personal/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e screenLabel ${{ matrix.screen }} com.abdickers.shire.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-${{ matrix.screen }}.log
            mkdir -p emulator-screenshots
            adb pull /sdcard/Android/data/com.abdickers.shire/files/proof/. emulator-screenshots/ || true
            ! grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' emulator-${{ matrix.screen }}.log
            grep -q 'OK (1 test)' emulator-${{ matrix.screen }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shire-personal-app-${{ matrix.screen }}
          path: |
            android-personal/app/build/outputs/apk/debug/app-debug.apk
            android-personal/app/build/reports/
            emulator-screenshots/
            emulator-*.log
          retention-days: 30
