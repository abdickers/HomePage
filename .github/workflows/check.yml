name: Check dashboard
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate application and saved-data behavior
        run: |
          node --check js/app.js
          node --check js/personal-mail.js
          node --test tests/*.test.js
          python3 -c "import ast; ast.parse(open('scripts/refresh-feeds.py', encoding='utf-8-sig').read())"
