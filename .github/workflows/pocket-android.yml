name: Build and emulate Pocket Command
on:
  push:
    paths: ['android/**', '.github/workflows/pocket-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/pocket-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK and test APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pixel-sized emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1280x2856
            adb shell wm density 480
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e screenLabel pixel-portrait com.abdickers.pocket.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-portrait.log
            ! grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' emulator-portrait.log
            grep -q 'OK (3 tests)' emulator-portrait.log
            adb shell wm size 1080x2400
            adb shell wm density 480
            adb shell settings put system font_scale 1.3
            adb shell am instrument -w -e screenLabel narrow-large-font com.abdickers.pocket.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-narrow.log
            ! grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' emulator-narrow.log
            grep -q 'OK (3 tests)' emulator-narrow.log
            mkdir -p emulator-screenshots
            adb pull /sdcard/Android/data/com.abdickers.pocket/files/screenshots/. emulator-screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-command-apk-and-emulator-proof
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/
            emulator-screenshots/
            emulator-*.log
          retention-days: 30
